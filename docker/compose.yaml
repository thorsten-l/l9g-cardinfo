# l9g-cardinfo/docker/compose.yaml
# Spring Boot per Volume-Mount, kein Dockerfile.
# jar + ../data read-only reingemountet; Health auf Management-Port 9000.
#
# vorher das aktuelle jar bereitstellen:
#   ( cd .. && mvn clean package ) && cp ../target/l9g-cardinfo.jar .
services:
  cardinfo:
    image: bellsoft/liberica-openjre-debian:25
    container_name: l9g-cardinfo
    hostname: cardinfo.dev.sonia.de
    restart: unless-stopped
    # data/config.yaml und data/secret.bin werden relativ zum working_dir gelesen
    working_dir: /
    command: ["java", "-jar", "/l9g-cardinfo.jar"]
    volumes:
      - ./l9g-cardinfo.jar:/l9g-cardinfo.jar:ro
      - ../data:/data:ro
    environment:
      - TZ=Europe/Berlin
    ports:
      - "8080:8080"
    extra_hosts:
      # LDAP (ldap.host.name in data/config.yaml) läuft auf dem Docker-Host
      - "id.dev.sonia.de:host-gateway"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/actuator/health | grep -q UP"]
      start_period: 60s
      start_interval: 5s
      interval: 30s
      timeout: 10s
      retries: 3
